name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image repo
        shell: bash
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}

      - name: Update GitOps repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          set -euo pipefail

          git config --global credential.helper store
          echo "https://${GIT_TOKEN}:x-oauth-basic@github.com" > ~/.git-credentials

          rm -rf gitops
          git clone https://github.com/PoneNyaSoeNyunt/grade-api-gitops.git gitops
          cd gitops

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s|image: ${{ env.IMAGE_REPO }}:.*|image: ${{ env.IMAGE_REPO }}:${{ github.sha }}|g" deployment.yaml
          else
            sed -i "s|image: ${{ env.IMAGE_REPO }}:.*|image: ${{ env.IMAGE_REPO }}:${{ github.sha }}|g" deployment.yaml
          fi

          if git diff --quiet -- deployment.yaml; then
            echo "No change in deployment.yaml"
            exit 0
          fi

          git add deployment.yaml
          git commit -m "Update image to ${{ github.sha }}"
          git push https://${GIT_TOKEN}@github.com/PoneNyaSoeNyunt/grade-api-gitops.git main
